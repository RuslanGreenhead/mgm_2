device: auto

data:
  data_dir: data/earth_data  # earth/data/earth_data/{earthquake,volcano,fire,flood}.csv
  dataset_file: earthquake   # earthquake | volcano | fire | flood
  batch_size: 128
  num_workers: 0            # 0 => fully deterministic data ordering
  pin_memory: false
  expand_train: true

model:
  drift_type: sphere        # euclidean | sphere | spectral
  dim_noise: 3
  hidden_dim: 128
  n_blocks: 4

  # euclidean & sphere drifts
  temps: [0.02, 0.05, 0.2]  # temperature ladder; per-T drift fields are summed
  dist_norm: true           # divide kernel distances by their batch mean
  kernel: laplace           # laplace | gauss
  grad_form: true           # kernel-gradient direction instead of displacement
  drop_T: true              # drop the per-T kernel-gradient constant
  max_step: 1.0             # per-sample cap on the step norm (null disables)

  # spectral drift
  matern_nu: 2.5            # 0.5 | 2.5 | .inf (heat kernel)
  matern_kappas: null       # null -> calibrated per-dataset ladder from winners.yaml
  matern_tables: matern_tables.pt   # kernel lookup tables, built on first use
  spec_norm: false          # rescale each per-kappa field by its e-folding angle

train:
  project: kgd-earth
  entity: null
  run_name: null
  seed: 0
  epochs: 20
  warmup_steps: 2500
  lr: 0.0005
  log_every: 50
  eval_every: 500
  grad_clip: 1.0
  weight_decay: 0.01
  ema_decay: 0.999
  mmd_gamma: 1.0

  # best-model selection (on validation)
  selection_metric: mmd
  selection_mode: min
  n_eval_repeats: 3

  # early stopping
  early_stopping_patience: 20

  use_wandb: false
